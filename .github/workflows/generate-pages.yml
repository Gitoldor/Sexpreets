name: Generate pages and deploy

on:
  push:
    branches: [main]
    paths:
      - "data/entries.json"
      - "scripts/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - ".github/workflows/generate-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate individual pages and site
        run: node scripts/generate-pages.js

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/ pages.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate pages [skip ci]"
            git push
          else
            echo "Generated pages are already up to date."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
